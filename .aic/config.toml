# aic audit config — see docs/architecture.md §6

[layers.l0]
commands = [
    "cargo check",
    "cargo clippy -- -D warnings",
]
secret_scan = true
address_verify = true

[layers.l1]
commands = ["cargo test --lib"]
max_duration_secs = 120

[layers.l2]
enabled = true
model = "codex" # aid agent name
rules_dir = ".aic/rules"

[layers.l3]
enabled = true
models = ["codex"] # aid agent names
swap = true
consensus_threshold = 1

[layers.l4]
scripts = [".aic/checks/*.sh"]

[integration]
aid_auto_audit = false
aib_auto_block = true
budget_usd_per_audit = 5.0
