[package]
name = "aic"
version = "0.2.2"
edition = "2021"
rust-version = "1.80"
description = "Cross-audit CLI for aid agent dispatch — runs a 5-layer verification pipeline (static / test / checklist / cross-LLM / evidence) on agent outputs"
license = "MIT"
repository = "https://github.com/agent-tools-org/aic"
homepage = "https://github.com/agent-tools-org/aic"
documentation = "https://github.com/agent-tools-org/aic#readme"
readme = "README.md"
keywords = ["cli", "ai", "code-review", "audit", "llm"]
categories = ["command-line-utilities", "development-tools"]
authors = ["sunoj"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
globset = { version = "0.4", default-features = false }
gray_matter = "0.2"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
wait-timeout = { version = "0.2", default-features = false }

[dev-dependencies]
assert_cmd = "2"
tempfile = "3"
